<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"/>
<title>Demo — App entrenamiento</title>
<style>
    * { box-sizing: border-box; }
    html, body {
        margin: 0;
        height: 100%;
        background: linear-gradient(165deg, #ecfdf5 0%, #FAF8F5 45%, #f5f1eb 100%);
        color: #134e4a;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        -webkit-tap-highlight-color: transparent;
    }
    .wrap {
        height: 100%;
        min-height: 100%;
        display: flex;
        flex-direction: column;
        padding: 6px 4px 8px;
    }
    .demo-nav-row {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: row;
        align-items: stretch;
        justify-content: center;
        gap: 8px;
        max-width: 100%;
    }
    .nav-arrow {
        align-self: center;
        flex-shrink: 0;
        width: 44px;
        height: 44px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid rgba(15, 118, 110, 0.32);
        border-radius: 9999px;
        background: #FAF8F5;
        color: #0f766e;
        cursor: pointer;
        box-shadow: 0 2px 12px rgba(15, 118, 110, 0.12), 0 1px 0 rgba(255, 255, 255, 0.9) inset;
        transition: background 0.18s ease, color 0.18s ease, border-color 0.18s ease, transform 0.15s ease;
    }
    .nav-arrow:hover {
        background: #ccfbf1;
        color: #115e59;
        border-color: rgba(15, 118, 110, 0.45);
    }
    .nav-arrow:active {
        transform: scale(0.96);
    }
    .nav-arrow:focus-visible {
        outline: 2px solid #0d9488;
        outline-offset: 2px;
    }
    .nav-arrow svg {
        display: block;
    }
    .screens {
        flex: 1;
        min-width: 0;
        min-height: 0;
        position: relative;
        border-radius: 1.25rem;
        overflow: hidden;
        background: #fff;
        box-shadow:
            0 0 0 1px rgba(15, 118, 110, 0.1),
            0 12px 36px -8px rgba(15, 118, 110, 0.18);
    }
    .screen {
        position: absolute;
        inset: 0;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.22s ease;
    }
    .screen.active {
        opacity: 1;
        visibility: visible;
    }
    .screen img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        object-position: center bottom;
    }
    .caption {
        flex-shrink: 0;
        text-align: center;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: rgba(19, 78, 74, 0.72);
        padding: 8px 4px 4px;
    }
</style>
</head>
<body>
<div class="wrap">
    <div class="demo-nav-row" aria-label="Demo de pantallas">
        <button type="button" class="nav-arrow" id="demo-prev" aria-label="Pantalla anterior">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </button>
        <div class="screens" id="screens">
            <div class="screen active" data-screen="0">
                <img src="fitness app/inicio.png" alt="Inicio" width="390" height="844" decoding="async"/>
            </div>
            <div class="screen" data-screen="1">
                <img src="fitness app/plan entreno.png" alt="Plan de entrenamiento" width="390" height="844" decoding="async"/>
            </div>
            <div class="screen" data-screen="2">
                <img src="fitness app/check in.png" alt="Check-in" width="390" height="844" decoding="async"/>
            </div>
            <div class="screen" data-screen="3">
                <img src="fitness app/comunidad.png" alt="Comunidad" width="390" height="844" decoding="async"/>
            </div>
            <div class="screen" data-screen="4">
                <img src="fitness app/perfil.png" alt="Perfil" width="390" height="844" decoding="async"/>
            </div>
        </div>
        <button type="button" class="nav-arrow" id="demo-next" aria-label="Pantalla siguiente">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M9 18l6-6-6-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </button>
    </div>
    <p class="caption" id="demo-caption" aria-live="polite">Inicio · 1 / 5</p>
</div>
<script>
    (function () {
        var labels = ["Inicio", "Plan", "Check-in", "Comunidad", "Perfil"];
        var screens = document.querySelectorAll(".screen[data-screen]");
        var prev = document.getElementById("demo-prev");
        var next = document.getElementById("demo-next");
        var caption = document.getElementById("demo-caption");
        var idx = 0;
        var n = 5;

        function show(i) {
            idx = ((i % n) + n) % n;
            screens.forEach(function (el) {
                var on = el.getAttribute("data-screen") === String(idx);
                el.classList.toggle("active", on);
            });
            if (caption) {
                caption.textContent = labels[idx] + " · " + (idx + 1) + " / " + n;
            }
        }

        prev.addEventListener("click", function () { show(idx - 1); });
        next.addEventListener("click", function () { show(idx + 1); });

        window.addEventListener("keydown", function (e) {
            if (e.key === "ArrowLeft") show(idx - 1);
            if (e.key === "ArrowRight") show(idx + 1);
        });
    })();
</script>
<script src="site.js" defer></script>
</body>
</html>
