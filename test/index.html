<style>
:root{
  --rosa:#F7DDE3;--bur:#5C1A36;--nar:#E8693A;--rm:#E9A3B6;--cre:#FFF6F1;--blanco:#FFFFFF;
  --ink:#3A2A30;--muted:#7D6670;--line:rgba(92,26,54,.14);
  --ground:var(--rosa);--card:var(--blanco);--text:var(--bur);--soft:var(--muted);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#2A1520;--card:#3A1E2B;--text:#FBE9EE;--soft:#D9B8C4;--line:rgba(251,233,238,.16);--cre:#331A26;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#2A1520;--card:#3A1E2B;--text:#FBE9EE;--soft:#D9B8C4;--line:rgba(251,233,238,.16);--cre:#331A26;color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ground);color:var(--text);font-family:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
.serif{font-family:'Fraunces',Georgia,serif}
.it{font-family:'Fraunces',Georgia,serif;font-style:italic;color:var(--nar);font-weight:500}
a{color:inherit}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--ground);border-bottom:1px solid var(--line)}
.top-in{max-width:720px;margin:0 auto;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-weight:700;font-size:17px;text-decoration:none;color:var(--text)}
.brand i{font-family:'Fraunces',Georgia,serif;color:var(--nar);font-weight:600}
.back{font-size:14px;color:var(--soft);text-decoration:none;font-weight:500}
.back:hover{color:var(--text)}
main{max-width:720px;margin:0 auto;padding-block:28px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin:4px 0 26px}
.bar > span{display:block;height:100%;background:var(--nar);border-radius:3px;transition:width .35s ease}
.eb{font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--nar);margin:0 0 12px}
h1,h2{font-family:'Fraunces',Georgia,serif;font-weight:500;letter-spacing:-.02em;line-height:1.08;margin:0;text-wrap:balance}
h1{font-size:clamp(40px,8vw,64px)}
h2{font-size:clamp(28px,5.5vw,40px)}
h1 em,h2 em{font-style:italic;color:var(--nar)}
.lead{font-size:19px;color:var(--text);margin:18px 0 0;max-width:34em}
.small{font-size:14px;color:var(--soft)}
.btn{appearance:none;border:0;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:10px;font:inherit;font-weight:700;font-size:17px;text-decoration:none;border-radius:999px;padding:16px 28px;transition:transform .2s ease,box-shadow .2s ease;min-height:52px}
.btn-main{background:var(--nar);color:#fff;box-shadow:0 10px 28px rgba(232,105,58,.28)}
.btn-main:hover{transform:translateY(-2px)}
.btn-alt{background:transparent;color:var(--text);border:1.5px solid var(--line)}
.btn-alt:hover{border-color:var(--nar)}
.btn:focus-visible,.opt:focus-visible,input:focus-visible{outline:3px solid var(--nar);outline-offset:3px}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:28px}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.pill{background:var(--card);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:600}
.hero-steps{display:flex;gap:10px;margin-top:34px;flex-wrap:wrap}
.q{margin-top:6px}
.q .step{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.ico{flex:none;width:58px;height:58px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;color:var(--bur);position:relative}
:root[data-theme="dark"] .ico{color:var(--text)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ico{color:var(--text)}}
.ico svg{width:60%;height:60%}
.opts{display:grid;gap:12px;margin-top:24px}
.opt{appearance:none;text-align:left;font:inherit;color:var(--text);background:var(--card);border:2px solid transparent;border-radius:20px;padding:18px 20px;cursor:pointer;display:flex;gap:14px;align-items:flex-start;transition:border-color .15s ease,transform .15s ease}
.opt:hover{border-color:var(--rm)}
.opt.sel{border-color:var(--nar)}
.opt .k{flex:none;width:28px;height:28px;border-radius:50%;background:var(--rosa);color:var(--bur);font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;margin-top:1px}
.opt.sel .k{background:var(--nar);color:#fff}
.field{display:block;margin-top:18px}
.field span{display:block;font-weight:700;font-size:15px;margin-bottom:8px}
input[type=text],input[type=email]{width:100%;font:inherit;font-size:18px;color:var(--text);background:var(--card);border:2px solid transparent;border-radius:16px;padding:15px 18px}
input[type=text]:focus,input[type=email]:focus{border-color:var(--nar);outline:none}
.check{display:flex;gap:12px;align-items:flex-start;margin-top:16px;font-size:15px;cursor:pointer}
.check input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--nar);flex:none}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:26px;gap:12px}
.link{appearance:none;background:none;border:0;font:inherit;color:var(--soft);cursor:pointer;font-weight:600;padding:8px 0}
.link:hover{color:var(--text)}
.err{color:#B3261E;font-size:14px;font-weight:600;margin-top:10px;min-height:1.2em}
:root[data-theme="dark"] .err{color:#FFB4AB}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .err{color:#FFB4AB}}
.card{background:var(--card);border-radius:26px;padding:26px 24px}
.card.b{background:var(--bur);color:#FFF6F1}
.card.b .eb{color:var(--rm)}
.res{display:grid;gap:16px;margin-top:28px}
.res p{margin:8px 0 0}
.path{display:flex;justify-content:space-between;gap:4px;margin:6px 0 4px;position:relative;padding-top:4px}
.path::before{content:"";position:absolute;left:24px;right:24px;top:28px;height:2px;background:var(--line)}
.ps{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;flex:1;min-width:0}
.ps .ico{width:48px;height:48px;opacity:.55}
.ps.done .ico{opacity:1}
.ps.here .ico{opacity:1;background:var(--nar);color:#fff;box-shadow:0 0 0 5px rgba(232,105,58,.22)}
.ps .lb{font-size:11.5px;font-weight:700;text-align:center;line-height:1.2;color:var(--soft)}
.ps.here .lb{color:var(--nar)}
.here-tag{position:absolute;top:-22px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--nar);white-space:nowrap}
.cta{margin-top:30px}
.offer{margin-top:16px;border:1.5px dashed var(--rm);border-radius:18px;padding:14px 16px;font-size:15px}
.fade{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.fade{animation:none}.bar>span{transition:none}.btn,.opt{transition:none}}
@media (max-width:520px){.ps .lb{font-size:10px}.ps .ico{width:40px;height:40px}.path::before{top:24px}.card{padding:22px 18px}}
footer{max-width:720px;margin:0 auto;padding-block:10px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font-size:13px;color:var(--soft);display:flex;gap:16px;flex-wrap:wrap}

  }

  function renderQ(){
    var q=Q[state.i], cur=state.ans[q.id];
    var head;
    if(q.step!=null){var s=STEPS[q.step]; head='<div class="step">'+icon(s.icon)+'<p class="eb" style="margin:0">'+esc(s.n)+' · '+esc(s.name)+'</p></div>';}
    else head='<p class="eb">'+esc(q.eb)+'</p>';
    var letters="ABCDE";
    var opts=q.opts.map(function(o,j){return '<button class="opt'+(cur===j?' sel':'')+'" data-j="'+j+'" aria-pressed="'+(cur===j)+'"><span class="k">'+letters[j]+'</span><span>'+esc(o)+'</span></button>';}).join("");
    app.innerHTML='<section class="fade q">'+bar(state.i+2)+head+'<h2>'+esc(q.title)+'</h2><div class="opts">'+opts+'</div>'+
      '<div class="nav"><button class="link" id="back">← Atrás</button><span class="small">'+(state.i+1)+' de '+Q.length+'</span></div></section>';
    Array.prototype.forEach.call(app.querySelectorAll(".opt"),function(b){
      b.onclick=function(){
        state.ans[q.id]=Number(b.getAttribute("data-j"));
        Array.prototype.forEach.call(app.querySelectorAll(".opt"),function(x){x.classList.remove("sel");x.setAttribute("aria-pressed","false");});
        b.classList.add("sel"); b.setAttribute("aria-pressed","true");
        setTimeout(function(){
          if(state.i<Q.length-1){state.i++;} else {state.screen="datos";}
          render(); top();
        },220);
      };
    });
    document.getElementById("back").onclick=function(){if(state.i>0){state.i--;}else{state.screen="profesion";} render();};
    focusFirst(cur!=null?".opt.sel":".opt");
  }

  function renderDatos(){
    app.innerHTML='<section class="fade">'+bar(TOTAL)+
      '<p class="eb">Último paso</p><h2>Tu resultado <em>está listo.</em></h2>'+
      '<p class="lead" style="font-size:17px">Dime tu nombre y tu email para verlo. Te lo mando también por email, para que lo tengas a mano.</p>'+
      '<label class="field"><span>Tu nombre</span><input type="text" id="nom" autocomplete="given-name" maxlength="60" value="'+esc(state.nombre)+'"></label>'+
      '<label class="field"><span>Tu email</span><input type="email" id="mail" autocomplete="email" inputmode="email" maxlength="120" value="'+esc(state.email)+'"></label>'+
      '<label class="check"><input type="checkbox" id="priv"'+(state.privacy?' checked':'')+'><span>Acepto la <a href="../privacidad/" target="_blank" rel="noopener">política de privacidad</a>.</span></label>'+
      '<label class="check"><input type="checkbox" id="mkt"'+(state.mkt?' checked':'')+'><span>Quiero recibir emails de Chus con ideas para convertir lo que sé en producto. Me puedo dar de baja cuando quiera.</span></label>'+
      '<div class="err" id="err"></div>'+
      '<div class="nav"><button class="link" id="back">← Atrás</button><button class="btn btn-main" id="ver">Ver mi resultado</button></div>'+
      '</section>';
    document.getElementById("back").onclick=function(){state.screen="q";state.i=Q.length-1;render();};
    document.getElementById("nom").focus({preventScroll:true});
    document.getElementById("ver").onclick=function(){
      var n=document.getElementById("nom").value.trim(), m=document.getElementById("mail").value.trim();
      var p=document.getElementById("priv").checked, k=document.getElementById("mkt").checked;
      var err=document.getElementById("err");
      if(!n){err.textContent="Escribe tu nombre.";return;}
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(m)){err.textContent="Revisa tu email: parece que falta algo.";return;}
      if(!p){err.textContent="Para ver el resultado, acepta la política de privacidad.";return;}
      state.nombre=n; state.email=m; state.privacy=p; state.mkt=k;
      state.result=compute();
      send(state.result);
      state.screen="resultado"; render(); top();
    };
  }

  function compute(){
    var paso="avanzado", idx=STEPS.length;
    for(var i=0;i<STEPS.length;i++){ var a=state.ans[STEPS[i].key]; if(a===0||a===1){paso=STEPS[i].key; idx=i; break;} }
    var ini=state.ans.inicio||0, obj=state.ans.objetivo||0;
    return {
      paso:paso, idx:idx,
      pasoNombre: paso==="avanzado" ? "Tu camino está muy avanzado" : STEPS[idx].n+" · "+STEPS[idx].name,
      inicio: T_INICIO[ini], inicioLabel: Q[0].opts[ini],
      freno: T_PASO[paso], semana: T_SEMANA[paso],
      objetivoLabel: Q[7].opts[obj], siguiente: T_OBJ[obj]
    };
  }

  function renderPath(r){
    return '<div class="path" role="img" aria-label="Tu posición en el Método Safari: '+esc(r.pasoNombre)+'">'+
      STEPS.map(function(s,i){
        var cls = i<r.idx ? "ps done" : (i===r.idx ? "ps here" : "ps");
        return '<div class="'+cls+'">'+(i===r.idx?'<span class="here-tag">Estás aquí</span>':'')+icon(s.icon)+'<span class="lb">'+esc(s.short)+'</span></div>';
      }).join("")+'</div>';
  }

  function renderResultado(){
    var r=state.result;
    app.innerHTML='<section class="fade">'+
      '<p class="eb">Tu resultado · '+esc(state.nombre)+'</p>'+
      '<h2>'+(r.paso==="avanzado" ? 'Tu camino está <em>muy avanzado.</em>' : 'Tu paso ahora: <em>'+esc(STEPS[r.idx].short==="Tu mapa"?"tu mapa":STEPS[r.idx].short)+'.</em>')+'</h2>'+
      '<div class="res">'+
        '<div class="card">'+renderPath(r)+'</div>'+
        '<div class="card"><p class="eb">Tu punto de partida</p><p>'+esc(r.inicio)+'</p></div>'+
        '<div class="card"><p class="eb">'+esc(r.pasoNombre)+'</p><p>'+esc(r.freno)+'</p></div>'+
        '<div class="card"><p class="eb">Lo que puedes hacer esta semana</p><p>'+esc(r.semana)+'</p></div>'+
        '<div class="card b"><p class="eb">Tu siguiente paso</p><p>'+esc(r.siguiente)+'</p>'+
          '<p style="margin-top:14px"><strong>¿Lo vemos juntas?</strong> En una llamada de 15 minutos me cuentas tu caso y vemos si tiene sentido trabajar juntas.</p>'+
          '<div class="row cta"><a class="btn btn-main" href="'+CALENDLY+'" target="_blank" rel="noopener">Reservar mi llamada de 15 minutos</a>'+
          '<a class="btn btn-alt" style="color:#FFF6F1;border-color:rgba(255,246,241,.35)" href="'+SKOOL+'" target="_blank" rel="noopener">Ver la serie gratis</a></div>'+
        '</div>'+
      '</div>'+
      '<p class="small" style="margin-top:22px">Te he enviado este resultado a '+esc(state.email)+'. Si no lo ves, mira en promociones o spam.</p>'+
      '<div class="nav"><button class="link" id="again">Volver a hacer el test</button></div>'+
      '</section>';
    document.getElementById("again").onclick=function(){state={screen:"intro",i:0,profesion:"",ans:{},nombre:"",email:"",privacy:false,mkt:false};render();top();};
  }

  function send(r){
    var respuestas={};
    Q.forEach(function(q){ if(state.ans[q.id]!=null) respuestas[q.id]=state.ans[q.id]; });
    var base={nombre:state.nombre,email:state.email,fecha:new Date().toISOString()};
    var lead=Object.assign({},base,{
      evento:"test_vives_completado", origen:"test_vives_de_lo_que_sabes",
      profesion:state.profesion, etapa:r.inicioLabel, objetivo:r.objetivoLabel,
      mayor_fuga:r.paso, paso:r.pasoNombre, respuestas:respuestas, marketing_opt_in:state.mkt
    });
    var informe=Object.assign({},base,{
      paso:r.pasoNombre, resultado:{inicio:r.inicio, freno:r.freno, semana:r.semana, siguiente:r.siguiente}
    });
    function post(url,body){
      try{
        return fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}).catch(function(){});
      }catch(e){}
    }
    post("/.netlify/functions/submit-lead",lead);
    post("/.netlify/functions/send-informe",informe);
  }

  render();
})();
</script>

</body>
</html>
